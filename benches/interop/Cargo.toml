[package]
name = "interop"
description = "A GPU image the fallback (wgpu on Vulkan) made, exported as a dma-buf, painted in a page on Xe3, against vello_cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
detour = { path = "../..", default-features = false, features = ["xe3", "fallback-vulkan"] }
wgpu = "30"
rustix = { version = "1", features = ["event"] }
