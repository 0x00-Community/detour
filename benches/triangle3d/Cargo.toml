[package]
name = "triangle3d"
description = "detour in a window: a triangle turning in 3D, transformed on the CPU each frame, drawn on Xe3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
detour = { package = "detour-gpu", path = "../..", default-features = false, features = ["xe3"] }
triangle = { path = "../triangle" }
