[package]
name = "detour-apple-metal"
description = "detour's Apple M3 / M4 (Apple9) runtime on macOS: mlirpass's Apple9 machine code run through Metal (the code in a binary archive's pipeline), its memory and parameters as the Apple9 ABI has them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
detour = { path = "../../..", default-features = false, features = ["agx-g13"] }
mlirpass = { workspace = true, features = ["target.apple9"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[dev-dependencies]

# build.rs makes the donor's archive (a process apart: Metal hands a pipeline compiled in this process back from its
# cache, not from an archive asked for later, measured)
[target.'cfg(target_os = "macos")'.build-dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
