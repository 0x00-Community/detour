# detour against Mesa on the same Xe3: `cargo bench --features xe3 --bench against_vulkan` (and against_opengl)
[[bench]]
name = "against_vulkan"
harness = false
required-features = ["xe3"]

[[bench]]
name = "against_opengl"
harness = false
required-features = ["xe3"]

[[bin]]
name = "detour"
path = "src/main.rs"
required-features = ["cli"]

# merging the page rasterizers' sync_files (page_raster.rs); mapping the canvases the CPU draws into (cpu_raster.rs)
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "fs", "mm"] }
ash = { version = "0.38", optional = true }

[dev-dependencies]
rustix = { version = "1", features = ["fs", "event"] }
# benches/against_vulkan.rs and against_opengl.rs: the same frames through Mesa's anv and iris (versions wgpu already
# pulls in)
ash = "0.38"
naga = { version = "30", features = ["glsl-in", "spv-out"] }
glow = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }

# One feature per GPU model detour drives itself; each pulls in only that vendor's crates. `fallback-vulkan` does on Vulkan
# (vello on wgpu) whatever the drivers present cannot; without it, asking detour for something no driver here does panics.
[features]
default = ["compiler", "fallback-vulkan", "webgl", "webgl2", "webgpu"]
# base's compiler, image, pack, regalloc and raster (MLIR, vello_common's strips); every driver needs it. Off, detour is
# the 2D scene, filters and compose types (and the fallback when on): what builds on Windows / macOS without jemalloc
compiler = ["dep:mlirformat", "dep:mlirpass", "dep:moremath", "dep:vello_common"]
# the <canvas> 3D contexts detour provides, each switchable; asking for one built out panics
webgl = []
webgl2 = []
webgpu = []
# Intel Xe3 (Panther Lake, PCI 8086:b0a0), kernel driver xe
xe3 = ["compiler", "dep:bytemuck", "dep:glifo", "dep:hashbrown", "dep:png", "vello_common/png"]
# Apple M1 (AGX G13), Asahi Linux, kernel driver asahi
agx-g13 = ["compiler", "mlirpass/target.agx", "mlirpass/target.apple9"]
# AMD RDNA2 (GFX10.3), kernel driver amdgpu
rdna2 = ["compiler", "mlirpass/target.rdna2"]
fallback-vulkan = ["dep:vello", "dep:wgpu", "dep:pollster", "dep:ash", "dep:log"]
cli = ["dep:clap"]

[workspace]
resolver = "3"
members = ["crates/apple/metal", "benches/interop", "benches/triangle", "benches/triangle3d"]

[workspace.package]
version = "0.1.6"
edition = "2024"
# mlirformat's (0.6 onwards) `if let` guards (rust-toolchain.toml pins it here; a git dependent like acde-base reads this)
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/0x00-Community/detour"
publish = ["ac", "crates-io"]

[workspace.dependencies]
# mlirformat and mlirpass from crates.io: the same mlirformat for both
mlirformat = "0.8.1"
# the dialects detour's frontend and backends run (their folds, canonicalization and inlining are behind them)
mlirpass = { version = "0.10.3", default-features = false, features = ["std", "dialect.arith", "dialect.func", "dialect.scf", "dialect.vector", "dialect.math", "dialect.gpu", "dialect.llvm", "dialect.spirv"] }
# the executor mlirpass runs a pipeline on (mlirpass does not re-export it)
moremath = { version = "0.2.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
# the 2D rasterizer's CPU half (strips), the same as acde's vello_cpu 0.3; vello_cpu itself (vendored: its coarse
# rasterization exported, `detour:` marks each change) the GPU's fine rasterization's input and the reference
vello_common = { version = "0.3", features = ["std"] }
libc = "0.2"
# the 2D scene's geometry and paints: the versions acde's blitz and vello use
kurbo = "0.13.1"
peniko = "0.6.1"

[profile.release]
debug = 1
