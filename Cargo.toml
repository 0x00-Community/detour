[package]
# detour is taken on crates.io (a function-hooking library): the package is detour-gpu, the library is still detour
name = "detour-gpu"
description = "detour: a GPU user-mode driver in Rust over mlirpass: the kernel interface, OpenGL (src/gl) and Vulkan (src/vk)"
version = "0.1.6"
edition = "2024"
# mlirformat's (0.6 onwards) `if let` guards (rust-toolchain.toml pins it here; a git dependent like acde-base reads this)
rust-version = "1.96"
license = "Apache-2.0"
publish = ["ac", "crates-io"]
repository = "https://github.com/0x00-Community/detour"
readme = "README.md"
# the generator, its genxml and the tests stay in the repository
exclude = ["tools", "data", "tests", "scripts"]

[lib]
name = "detour"
path = "src/lib.rs"

[dependencies]
# mlirformat and mlirpass from crates.io: the same mlirformat for both
mlirformat = "0.8.5"
# GLSL ⇒ SPIR-V (gl) and what an outside GPU backend needs (target.gpu); detour's Xe3 backend is src/passes/xe3
mlirpass = { version = "0.11.0", default-features = false, features = ["std", "target.gpu", "dialect.glsl", "target.spirv"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[profile.release]
debug = 1

