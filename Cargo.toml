[package]
# detour is taken on crates.io (a function-hooking library): the package is detour-gpu, the library is still detour
name = "detour-gpu"
description = "detour for its users (acde): the 2D scene and the drivers, aggregated; one feature per GPU model so only the drivers asked for build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# benches/ is local measurement against Vulkan (its own dev dependencies), not part of the package
exclude = ["benches/"]
repository.workspace = true
readme = "README.md"

[lib]
name = "detour"
path = "src/lib.rs"

[dependencies]
# the shader compiler and the drivers' codegen (feature `compiler`): acde's 2D types and the Vulkan fallback do not need them
mlirformat = { workspace = true, optional = true }
mlirpass = { workspace = true, features = ["dialect.image"], optional = true }
moremath = { workspace = true, optional = true }
serde.workspace = true
vello_common = { workspace = true, optional = true }
libc.workspace = true
kurbo.workspace = true
peniko.workspace = true
# the Vulkan fallback (module fallback)
vello = { version = "0.12", features = ["wgpu"], optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
# the fallback's device tiers say which one opened (request.rs)
log = { version = "0.4", optional = true }
# the vendored vello_cpu (module vello_cpu, under xe3): its default features plus f32_pipeline
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
glifo = { version = "0.4.0", default-features = false, features = ["std", "png"], optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"], optional = true }
png = { version = "0.18.1", optional = true }
# the debugging tool (src/main.rs, feature `cli`)
clap = { version = "4.6", features = ["derive"], optional = true }

# `detour devices` and the other debugging subcommands (src/cli/, one file a subcommand); a feature so acde does not
# build clap: `cargo run --features cli,xe3,agx-g13,rdna2 -- devices`
[[test]]
name = "fallback-compose"
path = "crates/fallback/tests/compose.rs"
required-features = ["fallback-vulkan"]

[[test]]
name = "base-frontend"
path = "crates/core/tests/frontend.rs"
required-features = ["compiler"]

[[test]]
name = "xe3_dialect-eu"
path = "crates/intel/dialect/tests/eu.rs"
required-features = ["xe3"]

[[test]]
name = "xe3_dialect-oracle"
path = "crates/intel/dialect/tests/oracle.rs"
required-features = ["xe3"]

