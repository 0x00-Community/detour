[package]
# detour is taken on crates.io (a function-hooking library): the package is detour-gpu, the library is still detour
name = "detour-gpu"
version = "0.9.0"
edition = "2024"
# mlirformat's (0.6 onwards) `if let` guards (rust-toolchain.toml pins it here; a git dependent like acde-base reads this)
rust-version = "1.96"
description = "detour: a GPU userspace driver in Rust over mlirpass, tuned to a few GPUs (Intel Xe3, AMD RDNA2): draws, shaders through SPIR-V compiled to each GPU's machine code"
readme = "README.md"
repository = "https://github.com/0x00-Community/detour"
license = "Apache-2.0"
# the generators, their Mesa data, the oracles and the tests stay in the repository
exclude = ["tests", "scripts"]
publish = ["ac", "crates-io"]

[lib]
name = "detour"
path = "src/lib.rs"

[dependencies]
# mlirformat and mlirpass from crates.io: the same mlirformat for both
mlirformat = "0"
# SPIR-V (target.spirv) and the upstream dialects the GPU lowerings start from
mlirpass = { version = "0", default-features = false, features = ["all-dialects", "std", "target.spirv"] }
moremath = { version = "0", default-features = false, features = ["alloc"] }
rustix = { version = "1", features = ["fs", "mm", "time"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# the examples write their shaders in GLSL, made SPIR-V by mlirpass's front end
mlirpass = { version = "0", default-features = false, features = ["target.glsl"] }

[workspace]
members = ["scripts/xe3gen"]

[profile.release]
debug = 1
